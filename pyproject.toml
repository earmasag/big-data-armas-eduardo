[project]
name = "bigdata-orinoco-proyecto-final"
version = "0.1.0"
description = "Pipeline integral de Big Data con CRISP-DM, Machine Learning, MongoDB, Reporte PDF, Streamlit y Docker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.0",
    "joblib>=1.3.2",
    "jupyterlab>=4.1.0",
    "matplotlib>=3.8.0",
    "mongomock>=4.1.2",
    "nbclient>=0.9.0",
    "nbformat>=5.9.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pymongo>=4.6.0",
    "reportlab>=4.1.0",
    "scikit-learn>=1.4.0",
    "streamlit>=1.32.0",
    "xgboost>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
